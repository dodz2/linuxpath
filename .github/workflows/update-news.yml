name: Mise à jour automatique des actualités cyber

on:
  schedule:
    # Tous les jours à 6h UTC (8h Paris) et 18h UTC (20h Paris)
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    # Permet un déclenchement manuel depuis l'interface GitHub

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📡 Lancer la collecte d'actualités
        run: |
          python3 .github/scripts/fetch_news.py

      - name: ✅ Vérifier les modifications
        id: check
        run: |
          if git diff --quiet data/news.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Aucune modification détectée."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Modifications détectées dans data/news.json"
          fi

      - name: 📤 Pusher les modifications
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LinuxPath NewsBot"
          git config user.email "linuxpath@dodz2.github.io"
          git add data/news.json
          git commit -m "📰 Mise à jour automatique des actualités cyber ($(date +'%d/%m/%Y'))"
          git push