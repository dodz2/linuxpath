name: Mise à jour automatique des actualités cyber

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Collect news
        run: python3 .github/scripts/fetch_news.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "📰 Mise à jour automatique des actualités cyber"
          branch: news/auto-update
          title: "📰 Actualités cyber"
          body: "Mise à jour automatique de `data/news.json`. La CI doit passer avant merge, ce qui déclenche ensuite Pages."
          add-paths: data/news.json
